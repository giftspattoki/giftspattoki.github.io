<!DOCTYPE html>
<html lang="en">
<head>

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;

        h1 { font-size: 120px; margin-bottom: 10px; }

            color: #1A1A2E;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;

            transition: transform 0.3s;
